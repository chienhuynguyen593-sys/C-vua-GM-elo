<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cờ Vua Stockfish 1 - 18</title>
    <!-- Thư viện giao diện bàn cờ -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: #161512;
            color: #bababa;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { width: 100%; max-width: 450px; }
        h2 { color: #fff; text-align: center; margin: 5px 0 12px; font-size: 20px; }

        /* Thanh điều khiển chọn Stockfish */
        .controls {
            background: #262421;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: space-between;
            align-items: center;
        }
        select, button {
            background: #363431;
            color: #fff;
            border: 1px solid #4a4744;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 14px;
        }
        button { background: #629924; border: none; font-weight: bold; cursor: pointer; }
        button.secondary { background: #4a4744; }
        button:active { opacity: 0.8; }

        /* Thanh đánh giá ưu thế (Eval Bar) */
        .eval-bar-container {
            width: 100%;
            height: 22px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            margin-bottom: 8px;
            border: 1px solid #444;
        }
        .eval-bar-white {
            height: 100%;
            width: 50%;
            background: #f0f0f0;
            transition: width 0.4s ease;
        }
        .eval-score-text {
            position: absolute;
            top: 2px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            font-weight: bold;
            color: #ff5500;
            text-shadow: 0px 0px 3px #000;
        }

        /* Bàn cờ */
        #myBoard { width: 100%; touch-action: none; margin-bottom: 12px; }

        /* Khung đánh giá thế cờ ở dưới */
        .analysis-box {
            background: #262421;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #629924;
        }
        .analysis-title { color: #fff; font-weight: bold; margin-bottom: 8px; font-size: 15px; display: flex; justify-content: space-between; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 14px; }
        .highlight { color: #81b64c; font-weight: bold; }
        .pv-line {
            background: #161512;
            padding: 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
            color: #ddd;
            margin-top: 6px;
            word-break: break-word;
        }
        .status-badge { font-size: 12px; color: #aaa; text-align: center; margin-top: 6px; }
    </style>
</head>
<body>

<div class="container">
    <h2>♟️ Cờ Vua Stockfish (1 - 18)</h2>

    <!-- PHẦN TRÊN: CHỌN PHIÊN BẢN & CHƠI VỚI MÁY -->
    <div class="controls">
        <select id="sfVersion" onchange="updateEngineLevel()">
            <!-- Tạo tự động từ Stockfish 1 đến 18 -->
        </select>
        <div>
            <button onclick="resetGame()">Ván mới</button>
            <button class="secondary" onclick="undoMove()">Đi lại</button>
        </div>
    </div>

    <!-- Thanh điểm ưu thế -->
    <div class="eval-bar-container">
        <div class="eval-bar-white" id="evalBar"></div>
        <div class="eval-score-text" id="evalText">0.00 (Cân bằng)</div>
    </div>

    <!-- Bàn cờ chính -->
    <div id="myBoard"></div>

    <!-- PHẦN DƯỚI: ĐÁNH GIÁ THẾ CỜ -->
    <div class="analysis-box">
        <div class="analysis-title">
            <span>📊 Phân Tích Thế Cờ</span>
            <span id="engineStatus" style="font-size: 12px; color: #81b64c;">Đang tải AI...</span>
        </div>
        <div class="stat-row">
            <span>Đánh giá điểm:</span>
            <span class="highlight" id="scoreDetail">0.00</span>
        </div>
        <div class="stat-row">
            <span>Nước đi tốt nhất:</span>
            <span class="highlight" id="bestMoveText">-</span>
        </div>
        <div class="stat-row">
            <span>Độ sâu tính toán:</span>
            <span id="depthText">0</span>
        </div>
        <div style="font-size: 13px; margin-top: 4px;">Biến đi dự kiến (Line):</div>
        <div class="pv-line" id="pvText">Hãy đi nước đầu tiên để AI phân tích...</div>
    </div>
    <div class="status-badge" id="gameStatus">Lượt của bạn (Quân Trắng)</div>
</div>

<!-- Thư viện jQuery, Chess.js và Chessboard.js -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

<script>
    // 1. Tạo danh sách chọn Stockfish từ 1 đến 18
    const selectEl = document.getElementById('sfVersion');
    const eloMap = [
        800, 950, 1100, 1250, 1400, 1550, 1700, 1850, 2000,
        2150, 2300, 2450, 2600, 2750, 2900, 3050, 3200, 3400
    ];
    for (let i = 1; i <= 18; i++) {
        let opt = document.createElement('option');
        opt.value = i;
        opt.text = `Stockfish ${i} (~${eloMap[i-1]} Elo)`;
        if (i === 18) opt.selected = true;
        selectEl.appendChild(opt);
    }

    // 2. Khởi tạo bàn cờ và luật cờ
    var board = null;
    var game = new Chess();
    var stockfish = null;
    var isEngineReady = false;
    var currentDepth = 12;

    // Tải Stockfish Worker từ CDN (Tối ưu nhẹ cho OPPO A60)
    async function initStockfish() {
        try {
            const response = await fetch('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');
            const scriptText = await response.text();
            const blob = new Blob([scriptText], { type: 'application/javascript' });
            stockfish = new Worker(URL.createObjectURL(blob));

            stockfish.onmessage = function(event) {
                const line = event.data;
                if (line === 'uciok') {
                    isEngineReady = true;
                    document.getElementById('engineStatus').innerText = 'Sẵn sàng';
                    updateEngineLevel();
                }
                parseEngineOutput(line);
            };
            stockfish.postMessage('uci');
            stockfish.postMessage('setoption name Hash value 32'); // Giới hạn 32MB RAM cho điện thoại
        } catch (e) {
            document.getElementById('engineStatus').innerText = 'Lỗi tải AI (Kiểm tra mạng)';
        }
    }

    // Điều chỉnh sức mạnh tương ứng từ Stockfish 1 đến 18
    function updateEngineLevel() {
        if (!isEngineReady) return;
        const ver = parseInt(document.getElementById('sfVersion').value);
        // Quy đổi phiên bản 1-18 sang Skill Level (0-20) và độ sâu (Depth)
        const skill = Math.min(20, Math.round((ver - 1) * (20 / 17)));
        currentDepth = Math.min(16, Math.max(4, Math.round(ver * 0.85)));

        stockfish.postMessage(`setoption name Skill Level value ${skill}`);
        document.getElementById('engineStatus').innerText = `SF ${ver} (Sức mạnh ${skill}/20)`;
    }

    // Đọc dữ liệu phân tích thế cờ từ Stockfish
    function parseEngineOutput(line) {
        if (line.startsWith('info depth')) {
            const depthMatch = line.match(/depth (\d+)/);
            const scoreCpMatch = line.match(/score cp (-?\d+)/);
            const scoreMateMatch = line.match(/score mate (-?\d+)/);
            const pvMatch = line.match(/ pv (.+)/);

            if (depthMatch) {
                document.getElementById('depthText').innerText = depthMatch[1];
            }

            // Tính điểm ưu thế (Quy đổi về góc nhìn của quân Trắng)
            let turnMultiplier = game.turn() === 'w' ? 1 : -1;
            if (scoreCpMatch) {
                let cp = (parseInt(scoreCpMatch[1]) * turnMultiplier) / 100;
                let sign = cp > 0 ? '+' : '';
                document.getElementById('scoreDetail').innerText = `${sign}${cp.toFixed(2)}`;
                document.getElementById('evalText').innerText = `${sign}${cp.toFixed(2)}`;

                // Cập nhật thanh trắng/đen
                let winPercent = 50 + (50 * (2 / (1 + Math.exp(-0.4 * cp)) - 1));
                winPercent = Math.max(5, Math.min(95, winPercent));
                document.getElementById('evalBar').style.width = winPercent + '%';
            } else if (scoreMateMatch) {
                let mate = parseInt(scoreMateMatch[1]) * turnMultiplier;
                document.getElementById('scoreDetail').innerText = `Chiếu bí sau ${Math.abs(mate)} nước`;
                document.getElementById('evalText').innerText = `M${mate}`;
                document.getElementById('evalBar').style.width = mate > 0 ? '100%' : '0%';
            }

            if (pvMatch) {
                const moves = pvMatch[1].split(' ');
                document.getElementById('bestMoveText').innerText = moves[0];
                document.getElementById('pvText').innerText = moves.slice(0, 6).join(' → ');
            }
        }

        // Khi máy tính xong nước đi của nó (Quân Đen)
        if (line.startsWith('bestmove') && game.turn() === 'b') {
            const bestMove = line.split(' ')[1];
            if (bestMove && bestMove !== '(none)') {
                game.move({
                    from: bestMove.substring(0, 2),
                    to: bestMove.substring(2, 4),
                    promotion: bestMove.length > 4 ? bestMove[4] : 'q'
                });
                board.position(game.fen());
                updateGameStatus();
                // Sau khi máy đi xong, tiếp tục phân tích thế cờ cho người chơi
                analyzePosition(12);
            }
        }
    }

    // Ra lệnh cho Stockfish tính toán
    function analyzePosition(depth) {
        if (!isEngineReady || game.game_over()) return;
        stockfish.postMessage('stop');
        stockfish.postMessage(`position fen ${game.fen()}`);
        stockfish.postMessage(`go depth ${depth}`);
    }

    // Xử lý kéo thả quân cờ
    function onDragStart(source, piece) {
        if (game.game_over() || game.turn() === 'b' || piece.search(/^b/) !== -1) return false;
    }

    function onDrop(source, target) {
        var move = game.move({ from: source, to: target, promotion: 'q' });
        if (move === null) return 'snapback';

        updateGameStatus();
        // Gọi máy tính nước đáp trả
        window.setTimeout(() => analyzePosition(currentDepth), 200);
    }

    function onSnapEnd() {
        board.position(game.fen());
    }

    function updateGameStatus() {
        let status = '';
        if (game.in_checkmate()) {
            status = 'Chiếu bí! ' + (game.turn() === 'w' ? 'Máy (Đen) thắng!' : 'Bạn (Trắng) thắng!');
        } else if (game.in_draw()) {
            status = 'Ván cờ Hòa!';
        } else {
            status = game.turn() === 'w' ? 'Lượt của bạn (Quân Trắng)' : 'Stockfish đang suy nghĩ...';
            if (game.in_check()) status += ' (Đang bị chiếu!)';
        }
        document.getElementById('gameStatus').innerText = status;
    }

    function resetGame() {
        game.reset();
        board.start();
        document.getElementById('evalBar').style.width = '50%';
        document.getElementById('evalText').innerText = '0.00 (Cân bằng)';
        document.getElementById('scoreDetail').innerText = '0.00';
        document.getElementById('bestMoveText').innerText = '-';
        document.getElementById('pvText').innerText = 'Bắt đầu ván mới...';
        updateGameStatus();
    }

    function undoMove() {
        game.undo(); // Lùi nước của máy
        game.undo(); // Lùi nước của bạn
        board.position(game.fen());
        updateGameStatus();
        analyzePosition(12);
    }

    // Khởi chạy bàn cờ
    board = Chessboard('myBoard', {
        draggable: true,
        position: 'start',
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
        onDragStart: onDragStart,
        onDrop: onDrop,
        onSnapEnd: onSnapEnd
    });

    initStockfish();
</script>

</body>
</html>
